<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Helvetica,Arial,sans-serif">
  <title>延迟分解</title>
  <rect x="0" y="0" width="640" height="360" fill="white"/>
  <g fill="#222" font-size="12">
    <text x="30" y="30" font-weight="bold" font-size="14">解码步组成，短上下文 vs 8K（ms/token）</text>
    <line x1="80" y1="60" x2="80" y2="300" stroke="#555" stroke-width="1.5"/>
    <line x1="80" y1="300" x2="620" y2="300" stroke="#555" stroke-width="1.5"/>
    <text x="48" y="304" font-size="10">0</text>
    <text x="48" y="204" font-size="10">10</text>
    <text x="48" y="104" font-size="10">20</text>
    <line x1="80" y1="200" x2="620" y2="200" stroke="#ddd"/>
    <line x1="80" y1="100" x2="620" y2="100" stroke="#ddd"/>
    <rect x="110" y="61" width="90" height="239" fill="#3b6a8a"/>
    <rect x="110" y="61" width="90" height="86" fill="#8a6d3b"/>
    <text x="155" y="52" text-anchor="middle" font-weight="bold">382-tok</text>
    <text x="155" y="318" text-anchor="middle" font-size="10">Spark 23.9</text>
    <text x="155" y="150" text-anchor="middle" font-size="10" fill="white">AMD 8.6</text>
    <rect x="250" y="70" width="90" height="230" fill="#3b6a8a"/>
    <rect x="250" y="70" width="90" height="107" fill="#8a6d3b"/>
    <text x="295" y="52" text-anchor="middle" font-weight="bold">8K 基线</text>
    <text x="295" y="318" text-anchor="middle" font-size="10">Spark 23.0</text>
    <text x="295" y="150" text-anchor="middle" font-size="10" fill="white">AMD 10.7</text>
    <rect x="390" y="69" width="90" height="231" fill="#3b6a8a"/>
    <rect x="390" y="69" width="90" height="108" fill="#8a6d3b"/>
    <text x="435" y="52" text-anchor="middle" font-weight="bold">8K B1+B2</text>
    <text x="435" y="318" text-anchor="middle" font-size="10">Spark 23.1</text>
    <text x="435" y="150" text-anchor="middle" font-size="10" fill="white">AMD 10.8</text>
    <rect x="120" y="330" width="14" height="12" fill="#8a6d3b"/><text x="140" y="340" font-size="11">AMD 融合头</text>
    <rect x="260" y="330" width="14" height="12" fill="#3b6a8a"/><text x="280" y="340" font-size="11">Spark 尾部</text>
    <text x="350" y="355" font-size="10" fill="#555">回执：QSA_DECODE_ROUND1（阶梯）、B1/B2；30 tok/s 预算 = 33.33 ms/步</text>
  </g>
</svg>
