<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="Helvetica,Arial,sans-serif">
  <title>Снижение дисперсии</title>
  <rect x="0" y="0" width="560" height="340" fill="white"/>
  <g fill="#222" font-size="12">
