    <text x="50" y="164" font-size="10">1e-5</text>
    <text x="50" y="104" font-size="10">1e-4</text>
    <line x1="100" y1="220" x2="530" y2="220" stroke="#ddd"/>
    <line x1="100" y1="160" x2="530" y2="160" stroke="#ddd"/>
